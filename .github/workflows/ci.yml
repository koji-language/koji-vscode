# Packs the extension at each push and pull request: what the publication would make, checked.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vsce package --out koji.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: koji-vsix
          path: koji.vsix
